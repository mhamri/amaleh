<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monthly revenue</title>
<style>
  :root {
    --page-bg: #0F172A;
    --card-bg: #1E293B;
    --bar-blue: #38BDF8;
    --bar-orange: #F59E0B;
    --text-bright: #F7FAFB;
    --text-muted: #94A3B8;
    --badge-bg: #14532D;
    --badge-text: #4ADE80;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    width: 480px;
    height: 340px;
  }
  .card {
    width: 414px;
    height: 282px;
    background: var(--card-bg);
    border-radius: 16px;
    box-sizing: border-box;
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
  }
  .title {
    color: var(--text-muted);
    font-size: 14px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0 0 10px 0;
    font-weight: 400;
  }
  .value-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }
  .value {
    color: var(--text-bright);
    font-size: 34px;
    font-weight: 700;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    letter-spacing: 0.5px;
  }
  .badge {
    background: var(--badge-bg);
    color: var(--badge-text);
    font-size: 13px;
    font-weight: 600;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 4px 10px;
    border-radius: 999px;
    line-height: 1.3;
  }
  .chart {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 8px;
    padding-bottom: 2px;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .bar {
    width: 40px;
    border-radius: 8px 8px 0 0;
    background: var(--bar-blue);
  }
  .col:last-child .bar {
    background: var(--bar-orange);
    border-radius: 10px 10px 0 0;
  }
  .label {
    color: var(--text-muted);
    font-size: 12px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="title">Monthly revenue</p>
    <div class="value-row">
      <span class="value">$48,250</span>
      <span class="badge">+12.4%</span>
    </div>
    <div class="chart">
      <div class="col"><div class="bar" style="height:52px"></div><span class="label">Jan</span></div>
      <div class="col"><div class="bar" style="height:64px"></div><span class="label">Feb</span></div>
      <div class="col"><div class="bar" style="height:60px"></div><span class="label">Mar</span></div>
      <div class="col"><div class="bar" style="height:82px"></div><span class="label">Apr</span></div>
      <div class="col"><div class="bar" style="height:78px"></div><span class="label">May</span></div>
      <div class="col"><div class="bar" style="height:112px"></div><span class="label">Jun</span></div>
    </div>
  </div>
</body>
</html>
