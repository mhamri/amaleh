version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      website:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /amaleh
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      skill:
        patterns: ['*']
